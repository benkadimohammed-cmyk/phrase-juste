name: Android APK and GitHub Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache persistent Android release signing keystore
        uses: actions/cache@v4
        with:
          path: |
            /tmp/android-tools/phrase-juste-release-v1.jks
            /tmp/android-tools/phrase-juste-keystore.pass
          key: phrase-juste-android-release-keystore-v1

      - name: Ensure Android SDK Platform & Build-Tools (Android 14–16 / API 34–36)
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME}" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies & run unit tests
        run: |
          bun install --frozen-lockfile || npm install --legacy-peer-deps
          npm test

      - name: Build web app & synchronize Capacitor Android assets
        run: |
          npm run cap:sync

      - name: Build, align, sign, and verify Phrase-juste-v1.0.0.apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm run build:apk

      - name: Inspect and verify compiled APK integrity
        run: |
          ls -lh releases/Phrase-juste-v1.0.0.apk
          file releases/Phrase-juste-v1.0.0.apk
          BUILD_TOOLS_DIR=$(ls -d "${ANDROID_HOME}/build-tools/"* | sort -V | tail -n 1)
          "${BUILD_TOOLS_DIR}/zipalign" -c -v -p 4 releases/Phrase-juste-v1.0.0.apk | tail -n 15
          "${BUILD_TOOLS_DIR}/apksigner" verify --verbose --print-certs releases/Phrase-juste-v1.0.0.apk
          "${BUILD_TOOLS_DIR}/aapt2" dump badging releases/Phrase-juste-v1.0.0.apk | head -n 15

      - name: Upload verified APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phrase-juste-v1.0.0.apk
          path: releases/Phrase-juste-v1.0.0.apk
          if-no-files-found: error

      - name: Publish versioned GitHub Release (binary APK asset)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "Phrase juste v1.0.0 — Android 16 (One UI 8.5) APK"
          body: |
            ### Phrase juste v1.0.0 — Verified Android APK (`app.phrasejuste.mobile`)
            - **Download**: Attach & install `Phrase-juste-v1.0.0.apk` directly on your Android phone
            - **Target SDK**: Android 16 (API 36) · **Minimum SDK**: Android 7.0 (API 24)
            - **Device Compatibility**: Verified for Samsung Galaxy M35 5G running **One UI 8.5 & Android 16 (API 36)**
            - **ZIP / libziparchive Integrity**: Zero streaming `GPBF_DATA_DESCRIPTOR` (`0x0008`) flags; 4-byte page-aligned uncompressed `resources.arsc` and `classes.dex` (`zipalign -p 4`)
            - **Cryptographic Signatures**: APK Signature Scheme v1 (JAR), v2 (Full APK), and v3 (`apksigner verify`)
          files: |
            releases/Phrase-juste-v1.0.0.apk
