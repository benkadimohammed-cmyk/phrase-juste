name: Android APK Build & GitHub Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: "tools platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install dependencies & run unit tests
        run: |
          npm ci
          npm test

      - name: Build, align, sign, and verify Phrase-juste-v1.0.0.apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'phrasejuste2026' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'phrasejuste' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'phrasejuste2026' }}
        run: |
          npm run build:apk

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phrase-juste-v1.0.0-apk
          path: releases/Phrase-juste-v1.0.0.apk
          if-no-files-found: error

      - name: Publish verified APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Phrase juste v1.0.0 (Android APK)"
          body: |
            ### Phrase juste v1.0.0 — Verified Android Package (`app.phrasejuste.mobile`)
            - **Target SDK**: Android 14 (API 34) · **Minimum SDK**: Android 8.0 (API 26)
            - **Compatible with**: Samsung Galaxy M35 5G (One UI 6 / Android 14) and all modern Android devices
            - **Signatures**: Verified APK Signature Scheme v1, v2, and v3 (`apksigner verify`)
            - **Alignment**: 4-byte page-aligned binary `resources.arsc` (`zipalign -p 4`)
          files: |
            releases/Phrase-juste-v1.0.0.apk
